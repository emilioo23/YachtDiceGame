name: SonarQube
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu'
      - name: Enable long paths
        shell: powershell
        run: git config --global core.longpaths true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      - name: Install coverage tool
        shell: powershell
        run: |
          $coverageToolPath = Join-Path $env:RUNNER_TEMP "coverage-tool"

          dotnet tool install dotnet-coverage --tool-path $coverageToolPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          $scannerPath = Join-Path $env:RUNNER_TEMP "scanner\dotnet-sonarscanner.exe"
          $coveragePath = Join-Path $env:RUNNER_TEMP "coverage-tool\dotnet-coverage.exe"
          $vswherePath = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vstestPath = & $vswherePath -latest -products * -requires Microsoft.Component.MSBuild `
            -find "**\TestPlatform\vstest.console.exe" | Select-Object -First 1

          if (-not $vstestPath) {
            throw "vstest.console.exe was not found."
          }

          & $scannerPath begin /k:"emilioo23_YachtDiceGame" /o:"emilioo23" `
            "/d:sonar.token=$env:SONAR_TOKEN" `
            "/d:sonar.cs.vscoveragexml.reportsPaths=coverage.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          msbuild Client\YachtDice.Client.slnx /restore /p:RestorePackagesConfig=true /t:Rebuild /p:Configuration=Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          msbuild Server\YachtDice.Server\YachtDice.Server.slnx /restore /p:RestorePackagesConfig=true `
            /t:Rebuild /p:Configuration=Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $coveragePath collect -f xml -o coverage.xml $vstestPath `
            "Client\YachtDice.Client.Tests\bin\Debug\YachtDice.Client.Tests.dll" `
            "Server\YachtDice.Server\YachtDice.Server.Tests\bin\Debug\YachtDice.Server.Tests.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path -LiteralPath "coverage.xml")) {
            throw "The coverage report was not generated."
          }

          & $scannerPath end "/d:sonar.token=$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
